name = "canconer-de-taverna"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Pàgines que poden connectar-se a la Taula (separades per comes).
# Afegeix-hi el teu domini si algun dia en tens un.
ALLOWED_ORIGINS = "https://xavixep.github.io"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# El pla gratuït de Cloudflare només admet Durable Objects amb emmagatzematge SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
